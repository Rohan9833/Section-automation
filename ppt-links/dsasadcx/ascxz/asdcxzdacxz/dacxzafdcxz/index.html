<!doctype html>
<html lang="en">
  <head>
    <base href="/ppt-updated/" />
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="max-age=200" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <title>digiLATERAL Services & Activities</title>
    <!-- Shared assets are resolved from /ppt-updated/ for generated links. -->
    <link rel="stylesheet" type="text/css" href="animate.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="global.css" media="screen" />

    <script
      src="jquery.min.js"
      type="text/javascript"
      language="javascript"
    ></script>

    <script
      src="jquery.mobile.custom.min.js"
      type="text/javascript"
      language="javascript"
    ></script>
    <script
      src="jquery.touchSwipe.min.js"
      type="text/javascript"
      language="javascript"
    ></script>
  </head>

  <body>
    <div id="wrapper" rel="1">
      <div class="menu"><img src="menu.png" width="37" alt="" /></div>
      <div class="slide_arrow">
        <div class="left_arrow">
          <img
            src="left_arrow.png"
            alt="previous icon"
            width="23"
            height="23"
          />
        </div>
        <div class="right_arrow">
          <img src="right_arrow.png" alt="next icon" width="23" height="23" />
        </div>
      </div>
      <div id="main_content"></div>
      <div class="reference active">
        <div class="box">
          <div class="slide_jumper" id="slide_jumper"></div>
        </div>

        <div class="box_btn"></div>
      </div>
    </div>
    <div id="myconsole"></div>
    <div id="click_through"></div>

<script
  src="global.js"
  type="text/javascript"
  language="javascript"
></script>
<script>
  window.PPT_PRESENTATION_CONFIG = {"sections":["product-advertisement"],"slides":{"product-advertisement":[100]},"companySlug":"dsasadcx","divisionSlug":"ascxz","usernameSlug":"asdcxzdacxz","projectSlug":"dacxzafdcxz"};

  async function enforceStatus(cfg) {
    if (!cfg || !cfg.companySlug) {
      console.warn("No presentation config found — skipping status check.");
      return true; // fail open
    }

    const params = new URLSearchParams({
      companySlug: cfg.companySlug,
      divisionSlug: cfg.divisionSlug,
      usernameSlug: cfg.usernameSlug,
      projectSlug: cfg.projectSlug,
    });

    try {
      const res = await fetch(`/api/url/status?${params}`);
      const data = await res.json();
      return data.active !== false;
    } catch (e) {
      console.error("Status check failed, allowing render:", e);
      return true;
    }
  }

  $(document).ready(function () {
    console.log("Presentation config:", window.PPT_PRESENTATION_CONFIG);

    enforceStatus(window.PPT_PRESENTATION_CONFIG)
      .then(function (isActive) {
        if (!isActive) {
          $("#main_content").html(
            '<div style="text-align:center;padding:80px 20px;font-family:Arial;">' +
            '<h1>This presentation link is no longer active.</h1>' +
            '</div>'
          );
          return;
        }
        loadPresentation(window.PPT_PRESENTATION_CONFIG);
        $(".reference").addClass("active");
      })
      .catch(function (err) {
        // absolute last-resort fallback: never leave the page blank
        console.error("Unexpected error during load, rendering anyway:", err);
        loadPresentation(window.PPT_PRESENTATION_CONFIG);
        $(".reference").addClass("active");
      });
  });
</script>
  </body>
</html>
